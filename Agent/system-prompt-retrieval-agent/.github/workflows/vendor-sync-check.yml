name: vendor-sync-byte-equality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: canonical_paths.py byte-equality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify vendored canonical_paths.py is byte-identical to remote source
        run: |
          python System-Prompt-Retrieval-Agent/scripts/sync_vendored_canonical_paths.py --check
