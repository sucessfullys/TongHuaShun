version: "v2.0"

global:
  cn_prefix: "照片级写实"
  en_prefix: "Photorealistic"

  cn_suffix: "真实皮肤纹理，真实布料细节，raw photo style，高细节"
  en_suffix: "realistic skin texture, realistic fabric detail, raw photo style, highly detailed"

templates:
  cn: "{prefix}，{scene_cn}，{subject_cn}，{clothing_cn}，{composition_cn}，{action_cn}，{anomaly_cn}，{normal_part_cn}，{lighting_cn}，{atmosphere_cn}，{suffix}。"
  en: "{prefix}, {scene_en}, {subject_en}, {clothing_en}, {composition_en}, {action_en}, {anomaly_en}, {normal_part_en}, {lighting_en}, {atmosphere_en}, {suffix}."

subjects:
