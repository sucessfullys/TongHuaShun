<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen Image Bench Viewer</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #ffffff;
      --ink: #171717;
      --muted: #68625a;
      --line: #ddd7cd;
      --accent: #116466;
      --accent-2: #9a3412;
      --good: #15803d;
      --mid: #a16207;
      --bad: #b91c1c;
      --shadow: 0 12px 32px rgba(24, 21, 17, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    .shell {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #fcfbf8;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      min-height: 100vh;
    }

    .topbar {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      display: grid;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      background: white;
      color: var(--ink);
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      background: white;
      color: var(--ink);
    }

    .list {
      overflow: auto;
      padding: 10px;
    }

    .item {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .item:hover {
      background: #f0ece4;
    }

    .item.active {
      background: white;
      border-color: #b7d0cb;
      box-shadow: 0 4px 14px rgba(17, 100, 102, 0.12);
    }

    .thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 6px;
      background: #e9e3d8;
      display: block;
    }

    .item-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mini-scores {
      display: flex;
      gap: 5px;
      margin-top: 7px;
      flex-wrap: wrap;
    }

    .score-pill {
      min-width: 28px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 8px;
      color: white;
      font-size: 12px;
      font-weight: 800;
    }

    .score-0 { background: var(--bad); }
    .score-1 { background: var(--mid); }
    .score-2 { background: var(--good); }
    .score-na { background: #64748b; }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100vh;
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 244, 239, 0.88);
      position: sticky;
      top: 0;
      z-index: 2;
      backdrop-filter: blur(8px);
    }

    .case-title {
      min-width: 0;
    }

    .case-title strong {
      display: block;
      font-size: 18px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .case-title span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .nav button {
      width: 38px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-weight: 800;
    }

    .nav button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .content {
      overflow: auto;
      padding: 22px 24px 32px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 0.95fr) minmax(360px, 1.05fr);
      gap: 22px;
      align-items: start;
    }

    .image-wrap {
      background: #151412;
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: sticky;
      top: 86px;
    }

    .hero-image {
      width: 100%;
      max-height: calc(100vh - 124px);
      object-fit: contain;
      display: block;
      background: #151412;
    }

    .details {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 18px rgba(24, 21, 17, 0.06);
    }

    section h2 {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.2;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--accent);
    }

    .prompt {
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .score-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      background: #fffdf9;
    }

    .score-name {
      font-size: 13px;
      line-height: 1.25;
      min-width: 0;
    }

    .score-name b {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-name span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .raw {
      max-height: 360px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #191714;
      color: #f8f2e8;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .kv {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 8px 12px;
      font-size: 13px;
      line-height: 1.35;
    }

    .kv dt {
      margin: 0;
      color: var(--muted);
    }

    .kv dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
        border-right: 0;
      }

      .list {
        max-height: 310px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .image-wrap {
        position: static;
      }
    }

    @media (max-width: 640px) {
      .main-header {
        padding: 14px;
        align-items: flex-start;
      }

      .content {
        padding: 14px;
      }

      .score-grid,
      .filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="topbar">
        <h1>Qwen Image Bench Viewer</h1>
        <div class="meta" id="datasetMeta">Loading judged JSONL...</div>
      </div>
      <div class="controls">
        <input id="search" class="search" type="search" placeholder="Search prompt or filename">
        <div class="filters">
          <select id="anatomyFilter">
            <option value="all">All anatomy</option>
            <option value="0">Anatomy score 0</option>
            <option value="1">Anatomy score 1</option>
            <option value="2">Anatomy score 2</option>
          </select>
          <select id="sortMode">
            <option value="id">Sort by ID</option>
            <option value="anatomy">Lowest anatomy first</option>
            <option value="composition">Lowest composition first</option>
            <option value="average">Lowest average first</option>
          </select>
        </div>
      </div>
      <div class="list" id="caseList"></div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="case-title">
          <strong id="caseName">No case selected</strong>
          <span id="casePath"></span>
        </div>
        <div class="nav">
          <button id="prevBtn" type="button" aria-label="Previous case">&lt;</button>
          <button id="nextBtn" type="button" aria-label="Next case">&gt;</button>
        </div>
      </header>

      <div class="content" id="content">
        <div class="empty">Loading...</div>
      </div>
    </main>
  </div>

  <script>
    const DATA_FILE = "bad_judge_input_judged.jsonl";
    let records = [];
    let filtered = [];
    let selectedId = null;

    const el = {
      meta: document.getElementById("datasetMeta"),
      list: document.getElementById("caseList"),
      content: document.getElementById("content"),
      caseName: document.getElementById("caseName"),
      casePath: document.getElementById("casePath"),
      search: document.getElementById("search"),
      anatomyFilter: document.getElementById("anatomyFilter"),
      sortMode: document.getElementById("sortMode"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
    };

    fetch(DATA_FILE)
      .then((res) => {
        if (!res.ok) throw new Error(`Failed to load ${DATA_FILE}`);
        return res.text();
      })
      .then((text) => {
        records = text.trim().split(/\n+/).filter(Boolean).map((line) => {
          const row = JSON.parse(line);
          row._scores = parseScores(row.judge_model_output);
          row._flatScores = flattenScores(row._scores);
          row._imageSrc = row.filename || basename(row.image_path);
          row._average = average(row._flatScores.map((s) => numericScore(s.score)));
          return row;
        });
        selectedId = records[0]?.ID ?? null;
        applyFilters();
      })
      .catch((err) => {
        el.meta.textContent = "Failed to load JSONL";
        el.content.innerHTML = `<div class="empty">${escapeHtml(err.message)}. Serve this folder with a local HTTP server.</div>`;
      });

    el.search.addEventListener("input", applyFilters);
    el.anatomyFilter.addEventListener("change", applyFilters);
    el.sortMode.addEventListener("change", applyFilters);
    el.prevBtn.addEventListener("click", () => moveSelection(-1));
    el.nextBtn.addEventListener("click", () => moveSelection(1));

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") moveSelection(-1);
      if (event.key === "ArrowRight") moveSelection(1);
    });

    function applyFilters() {
      const q = el.search.value.trim().toLowerCase();
      const anatomyValue = el.anatomyFilter.value;

      filtered = records.filter((row) => {
        const haystack = `${row.filename || ""} ${row.prompt || ""}`.toLowerCase();
        const anatomy = scoreFor(row, "Anatomical Portraiture", "Anatomical Fidelity");
        const matchesText = !q || haystack.includes(q);
        const matchesAnatomy = anatomyValue === "all" || String(anatomy) === anatomyValue;
        return matchesText && matchesAnatomy;
      });

      const sortMode = el.sortMode.value;
      filtered.sort((a, b) => {
        if (sortMode === "anatomy") {
          return compareScore(a, b, "Anatomical Portraiture", "Anatomical Fidelity");
        }
        if (sortMode === "composition") {
          return compareScore(a, b, "Composition", "Composition");
        }
        if (sortMode === "average") {
          return (a._average ?? 99) - (b._average ?? 99);
        }
        return Number(a.ID) - Number(b.ID);
      });

      if (!filtered.some((row) => row.ID === selectedId)) {
        selectedId = filtered[0]?.ID ?? null;
      }

      renderList();
      renderSelected();
      el.meta.textContent = `${filtered.length} of ${records.length} cases`;
    }

    function renderList() {
      if (!filtered.length) {
        el.list.innerHTML = `<div class="empty">No matching cases.</div>`;
        return;
      }

      el.list.innerHTML = filtered.map((row) => {
        const comp = scoreFor(row, "Composition", "Composition");
        const anatomy = scoreFor(row, "Anatomical Portraiture", "Anatomical Fidelity");
        const active = row.ID === selectedId ? " active" : "";
        return `
          <button class="item${active}" type="button" data-id="${escapeAttr(row.ID)}">
            <img class="thumb" src="${escapeAttr(row._imageSrc)}" alt="">
            <div>
              <div class="item-title">#${escapeHtml(row.ID)} ${escapeHtml(row.filename || "")}</div>
              <div class="item-sub">${escapeHtml(row.prompt || "")}</div>
              <div class="mini-scores">
                ${scorePill(comp, "C")}
                ${scorePill(anatomy, "A")}
              </div>
            </div>
          </button>
        `;
      }).join("");

      el.list.querySelectorAll(".item").forEach((button) => {
        button.addEventListener("click", () => {
          selectedId = Number(button.dataset.id);
          renderList();
          renderSelected();
        });
      });
    }

    function renderSelected() {
      const row = records.find((item) => item.ID === selectedId);
      if (!row) {
        el.caseName.textContent = "No case selected";
        el.casePath.textContent = "";
        el.content.innerHTML = `<div class="empty">No case selected.</div>`;
        return;
      }

      el.caseName.textContent = `#${row.ID} ${row.filename || basename(row.image_path)}`;
      el.casePath.textContent = row.image_path || "";

      const scores = row._flatScores.length
        ? row._flatScores.map((score) => `
          <div class="score-row">
            <div class="score-name">
              <b>${escapeHtml(score.level2)}</b>
              <span>${escapeHtml(score.level3)}</span>
            </div>
            ${scorePill(score.score)}
          </div>
        `).join("")
        : `<div class="empty">No parsed scores.</div>`;

      el.content.innerHTML = `
        <div class="layout">
          <div class="image-wrap">
            <img class="hero-image" src="${escapeAttr(row._imageSrc)}" alt="${escapeAttr(row.filename || "")}">
          </div>
          <div class="details">
            <section>
              <h2>Prompt</h2>
              <p class="prompt">${escapeHtml(row.prompt || "")}</p>
            </section>
            <section>
              <h2>Scores</h2>
              <div class="score-grid">${scores}</div>
            </section>
            <section>
              <h2>Metadata</h2>
              <dl class="kv">
                <dt>ID</dt><dd>${escapeHtml(row.ID)}</dd>
                <dt>Filename</dt><dd>${escapeHtml(row.filename || "")}</dd>
                <dt>Dims</dt><dd>${escapeHtml(row.dims_en || "")}</dd>
                <dt>Average</dt><dd>${row._average == null ? "N/A" : row._average.toFixed(2)}</dd>
              </dl>
            </section>
            <section>
              <h2>Judge Raw Output</h2>
              <pre class="raw">${escapeHtml(stripThink(row.aesthetics_judge_output || ""))}</pre>
            </section>
          </div>
        </div>
      `;
    }

    function moveSelection(delta) {
      if (!filtered.length) return;
      const index = filtered.findIndex((row) => row.ID === selectedId);
      const nextIndex = Math.min(filtered.length - 1, Math.max(0, index + delta));
      selectedId = filtered[nextIndex].ID;
      renderList();
      renderSelected();
    }

    function parseScores(raw) {
      if (!raw) return {};
      try {
        return typeof raw === "string" ? JSON.parse(raw) : raw;
      } catch {
        return {};
      }
    }

    function flattenScores(scores) {
      const aesthetics = scores?.Aesthetics || {};
      const rows = [];
      Object.entries(aesthetics).forEach(([level2, value]) => {
        Object.entries(value || {}).forEach(([level3, cell]) => {
          rows.push({ level2, level3, score: cell?.score ?? "N/A" });
        });
      });
      return rows;
    }

    function scoreFor(row, level2, level3) {
      const hit = row._flatScores.find((item) => item.level2 === level2 && item.level3 === level3);
      return hit ? hit.score : "N/A";
    }

    function compareScore(a, b, level2, level3) {
      return numericScore(scoreFor(a, level2, level3)) - numericScore(scoreFor(b, level2, level3));
    }

    function numericScore(score) {
      if (score === 0 || score === "0") return 0;
      if (score === 1 || score === "1") return 1;
      if (score === 2 || score === "2") return 2;
      return 99;
    }

    function average(values) {
      const valid = values.filter((value) => value !== 99);
      if (!valid.length) return null;
      return valid.reduce((sum, value) => sum + value, 0) / valid.length;
    }

    function scorePill(score, label) {
      const normalized = numericScore(score);
      const cls = normalized === 99 ? "score-na" : `score-${normalized}`;
      const text = label ? `${label}:${score}` : score;
      return `<span class="score-pill ${cls}">${escapeHtml(text)}</span>`;
    }

    function basename(path) {
      return String(path || "").split("/").pop();
    }

    function stripThink(text) {
      return String(text).replace(/<think>[\s\S]*?<\/think>/g, "").trim();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
  </script>
</body>
</html>
